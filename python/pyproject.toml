[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "postproject"
version = "0.5.0a1"
description = "Python bindings for application-neutral production knowledge infrastructure"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
authors = [{ name = "PostProject contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Video",
]

[project.urls]
Homepage = "https://github.com/postproject-org/postproject"
Repository = "https://github.com/postproject-org/postproject"

[project.optional-dependencies]
dev = [
  "ruff==0.16.8",
  "ty==0.0.82",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["src/postproject/_abi.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["SIM117"]
