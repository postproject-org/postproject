name: Publish documentation

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install --yes doxygen
      - run: python -m pip install --disable-pip-version-check -r docs/requirements.txt
      - run: mkdir -p target/doxygen
      - run: doxygen Doxyfile
      - run: python tools/normalize_doxygen_xml.py target/doxygen/xml
      - run: python tools/check_docs_coverage.py include/postproject/postproject.h target/doxygen/xml
      - run: sphinx-build --fail-on-warning --keep-going -b html docs target/site
      - run: python tools/build_rustdoc.py
      - name: Add Rust reference
        shell: bash
        run: |
          mkdir -p target/site/rustdoc
          cp -a target/doc/. target/site/rustdoc/
      - name: Preserve the audited 0.5 release candidate
        run: cmake -E copy_directory target/site target/release-candidate-docs-0.5-alpha1
      - name: Find the signed 0.5 release tag
        id: release_0_5
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin refs/tags/v0.5.0-alpha.1 >/dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        with:
          ref: v0.3.0-alpha.1
          path: target/released-docs-source
      - name: Build immutable release documentation
        working-directory: target/released-docs-source
        run: |
          mkdir -p target/doxygen
          doxygen Doxyfile
          python "$GITHUB_WORKSPACE/tools/normalize_doxygen_xml.py" target/doxygen/xml
          python tools/check_docs_coverage.py include/postproject/postproject.h target/doxygen/xml
          sphinx-build --fail-on-warning --keep-going -b html docs "$GITHUB_WORKSPACE/target/site/0.3.0-alpha.1"
      - uses: actions/checkout@v7
        with:
          ref: v0.3.0-alpha.2
          path: target/released-docs-source-alpha2
      - name: Build 0.3.0-alpha.2 release documentation
        working-directory: target/released-docs-source-alpha2
        run: |
          mkdir -p target/doxygen
          doxygen Doxyfile
          python "$GITHUB_WORKSPACE/tools/normalize_doxygen_xml.py" target/doxygen/xml
          python tools/check_docs_coverage.py include/postproject/postproject.h target/doxygen/xml
          sphinx-build --fail-on-warning --keep-going -b html docs "$GITHUB_WORKSPACE/target/site/0.3.0-alpha.2"
      - uses: actions/checkout@v7
        with:
          ref: v0.4.0-alpha.1
          path: target/released-docs-source-0.4-alpha1
      - name: Build 0.4.0-alpha.1 release documentation
        working-directory: target/released-docs-source-0.4-alpha1
        run: |
          mkdir -p target/doxygen
          doxygen Doxyfile
          python "$GITHUB_WORKSPACE/tools/normalize_doxygen_xml.py" target/doxygen/xml
          python tools/check_docs_coverage.py include/postproject/postproject.h target/doxygen/xml
          sphinx-build --fail-on-warning --keep-going -b html docs "$GITHUB_WORKSPACE/target/site/0.4.0-alpha.1"
      - uses: actions/checkout@v7
        if: steps.release_0_5.outputs.available == 'true'
        with:
          ref: v0.5.0-alpha.1
          path: target/released-docs-source-0.5-alpha1
      - name: Build 0.5.0-alpha.1 release documentation from its tag
        if: steps.release_0_5.outputs.available == 'true'
        working-directory: target/released-docs-source-0.5-alpha1
        run: |
          mkdir -p target/doxygen
          doxygen Doxyfile
          python "$GITHUB_WORKSPACE/tools/normalize_doxygen_xml.py" target/doxygen/xml
          python tools/check_docs_coverage.py include/postproject/postproject.h target/doxygen/xml
          sphinx-build --fail-on-warning --keep-going -b html docs "$GITHUB_WORKSPACE/target/site/0.5.0-alpha.1"
          cmake -E copy_directory "$GITHUB_WORKSPACE/target/site/0.5.0-alpha.1" "$GITHUB_WORKSPACE/target/site/latest"
      - name: Publish the audited 0.5 release candidate before tagging
        if: steps.release_0_5.outputs.available == 'false'
        run: |
          cmake -E copy_directory target/release-candidate-docs-0.5-alpha1 target/site/0.5.0-alpha.1
          cmake -E copy_directory target/release-candidate-docs-0.5-alpha1 target/site/latest
      - uses: actions/checkout@v7
        with:
          ref: v0.6.0-alpha.1
          path: target/released-docs-source-0.6-alpha1
      - name: Build 0.6.0-alpha.1 release documentation from its tag
        working-directory: target/released-docs-source-0.6-alpha1
        run: |
          mkdir -p target/doxygen
          doxygen Doxyfile
          python "$GITHUB_WORKSPACE/tools/normalize_doxygen_xml.py" target/doxygen/xml
          python tools/check_docs_coverage.py include/postproject/postproject.h target/doxygen/xml
          sphinx-build --fail-on-warning --keep-going -b html docs "$GITHUB_WORKSPACE/target/site/0.6.0-alpha.1"
          cmake -E copy_directory "$GITHUB_WORKSPACE/target/site/0.6.0-alpha.1" "$GITHUB_WORKSPACE/target/site/latest"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: target/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
