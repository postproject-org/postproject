name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The public CLI binary and C library intentionally share the installed
      # name `postproject`. MSVC otherwise races while writing postproject.pdb.
      - run: cargo test --workspace --all-features --locked --exclude postproject-ffi
      - run: cargo test -p postproject-ffi --all-features --locked

  msrv:
    name: Minimum Rust 1.85
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --all-features --locked

  quality:
    name: Formatting, lints, and documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install --disable-pip-version-check -e "./python[dev]"
      - run: ruff check python/src python/tests examples/python docs/examples/python docs/_ext
      - run: ruff format --check python/src python/tests examples/python docs/examples/python docs/_ext
      - run: ty check --project python python/src python/tests examples/python docs/examples/python
      - run: python tools/check_versions.py
      - run: python tools/check_example_coverage.py
      - run: python tools/flatpak_module.py check
      - run: python -m unittest tools/test_flatpak_module.py tools/test_build_platform_wheel.py tools/test_compatibility_usage.py
      - run: python -m unittest tools/test_build_rustdoc.py
      - run: ruff check tools/build_rustdoc.py tools/test_build_rustdoc.py
      - run: ruff format --check tools/build_rustdoc.py tools/test_build_rustdoc.py
      - run: ruff check tools/check_versions.py tools/check_cpp_header_warnings.py tools/check_example_coverage.py tools/check_docs_coverage.py tools/test_check_docs_coverage.py tools/compatibility_usage.py tools/test_compatibility_usage.py tools/normalize_doxygen_xml.py tools/test_normalize_doxygen_xml.py tools/flatpak_module.py tools/test_flatpak_module.py tools/build_platform_wheel.py tools/test_build_platform_wheel.py
      - run: ruff format --check tools/check_versions.py tools/check_cpp_header_warnings.py tools/check_example_coverage.py tools/check_docs_coverage.py tools/test_check_docs_coverage.py tools/compatibility_usage.py tools/test_compatibility_usage.py tools/normalize_doxygen_xml.py tools/test_normalize_doxygen_xml.py tools/flatpak_module.py tools/test_flatpak_module.py tools/build_platform_wheel.py tools/test_build_platform_wheel.py
      - run: ty check tools/check_versions.py tools/check_example_coverage.py tools/check_docs_coverage.py tools/test_check_docs_coverage.py tools/compatibility_usage.py tools/test_compatibility_usage.py tools/normalize_doxygen_xml.py tools/test_normalize_doxygen_xml.py tools/flatpak_module.py tools/test_flatpak_module.py tools/build_platform_wheel.py tools/test_build_platform_wheel.py
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path fuzz/Cargo.toml --bins --locked -- -D warnings

  real-ffmpeg:
    name: Reference executor (real FFmpeg)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - run: >-
          cargo test --locked -p postproject-media --test executor
          real_ffmpeg_encodes_the_shipped_fixture -- --ignored

  documentation:
    name: Unified documentation and links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install --yes doxygen
      - run: python -m pip install --disable-pip-version-check -r docs/requirements.txt
      - uses: taiki-e/install-action@v2
        with:
          tool: lychee,typos-cli
      - run: mkdir -p target/doxygen
      - run: doxygen Doxyfile
      - run: python tools/normalize_doxygen_xml.py target/doxygen/xml
      - run: python tools/check_docs_coverage.py include/postproject/postproject.h target/doxygen/xml
      - run: python -m unittest tools/test_check_docs_coverage.py tools/test_normalize_doxygen_xml.py
      - run: sphinx-build --fail-on-warning --keep-going -b html docs target/postproject
      - run: >-
          lychee --offline --no-progress --root-dir target
          target/postproject README.md
      - run: typos README.md docs

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features --config fuzz/deny.toml
          manifest-path: fuzz/Cargo.toml

  cpp-header:
    name: C++ header with current compilers
    runs-on: ubuntu-latest
    # The wrapper is compiled by each host's own compiler; check the newest
    # GCC and Clang, which warn about more than the runner's default compiler.
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed gcc clang python
      - uses: actions/checkout@v7
      - run: python3 tools/check_cpp_header_warnings.py g++ clang++

  c-abi:
    name: C ABI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p postproject-ffi
      - name: Verify generated ABI declarations
        shell: bash
        run: |
          python3 -m unittest tools/test_generate_abi.py tools/test_check_abi_layout.py
          diff -u python/src/postproject/_abi.py \
            <(python3 tools/generate_abi.py include/postproject/postproject.h)
          diff -u tests/abi/expected-symbols.txt \
            <(python3 tools/generate_abi.py include/postproject/postproject.h --symbols)
      - name: Install public ABI
        shell: bash
        run: |
          cmake -S . -B target/cmake-abi \
            -DPOSTPROJECT_LIBRARY="$PWD/target/release/libpostproject.so" \
            -DCMAKE_INSTALL_PREFIX="$PWD/target/abi-install"
          cmake --install target/cmake-abi
      - name: Verify public struct layouts
        shell: bash
        run: |
          python3 tools/generate_abi.py include/postproject/postproject.h \
            --layout-c > target/abi-layout.c
          cc -std=c11 -Wall -Wextra -Werror \
            -Itarget/abi-install/include target/abi-layout.c \
            -o target/abi-layout
          target/abi-layout | \
            python3 tools/check_abi_layout.py python/src/postproject/_abi.py
      - run: >-
          cc -std=c11 -Wall -Wextra -Werror
          -Iinclude tests/abi/c_smoke.c
          -Ltarget/release -lpostproject
          -Wl,-rpath,$PWD/target/release
          -o target/c-smoke
      - run: target/c-smoke target/c-smoke.pproj target
      - name: Verify exported ABI symbols
        shell: bash
        run: >-
          diff -u tests/abi/expected-symbols.txt
          <(nm -D --defined-only target/release/libpostproject.so |
          awk '{print $3}' | sort)

  native-package:
    name: Native package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            link_library: libpostproject.so
            python_library: libpostproject.so
            static_library: libpostproject.a
            runtime_library: ""
            cli_executable: postproject
            artifact: linux-x86_64
            # The Linux platform wheel is built for glibc 2.28 by `platform-wheel-linux`.
            wheel_platform: ""
          - os: macos-latest
            link_library: libpostproject.dylib
            python_library: libpostproject.dylib
            static_library: libpostproject.a
            runtime_library: ""
            cli_executable: postproject
            artifact: macos-native
            wheel_platform: macosx_11_0_arm64
          - os: windows-latest
            link_library: postproject.dll.lib
            python_library: postproject.dll
            static_library: postproject.lib
            runtime_library: postproject.dll
            cli_executable: postproject.exe
            artifact: windows-x86_64
            wheel_platform: win_amd64
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p postproject-ffi
      - run: cargo build --release --locked -p postproject-cli
      - name: Test Python binding against native library
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/python/src
          POSTPROJECT_LIBRARY: ${{ github.workspace }}/target/release/${{ matrix.python_library }}
          POSTPROJECT_CLI: ${{ github.workspace }}/target/release/${{ matrix.cli_executable }}
        run: python -m unittest discover -s python/tests -v
      - name: Install native package
        shell: bash
        env:
          LINK_LIBRARY: ${{ matrix.link_library }}
          STATIC_LIBRARY: ${{ matrix.static_library }}
          RUNTIME_LIBRARY: ${{ matrix.runtime_library }}
          CLI_EXECUTABLE: ${{ matrix.cli_executable }}
        run: |
          package_args=(
            -S .
            -B target/cmake-package
            "-DPOSTPROJECT_LIBRARY=$GITHUB_WORKSPACE/target/release/$LINK_LIBRARY"
            "-DPOSTPROJECT_STATIC_LIBRARY=$GITHUB_WORKSPACE/target/release/$STATIC_LIBRARY"
            "-DPOSTPROJECT_CLI_EXECUTABLE=$GITHUB_WORKSPACE/target/release/$CLI_EXECUTABLE"
            "-DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/target/install"
            -DCMAKE_BUILD_TYPE=Release
          )
          if [[ -n "$RUNTIME_LIBRARY" ]]; then
            package_args+=("-DPOSTPROJECT_RUNTIME_LIBRARY=$GITHUB_WORKSPACE/target/release/$RUNTIME_LIBRARY")
          fi
          cmake "${package_args[@]}"
      - run: cmake --install target/cmake-package
      - if: matrix.os == 'ubuntu-latest'
        run: pkg-config --validate target/install/lib/pkgconfig/postproject.pc
      - name: Configure consumer without Cargo
        shell: bash
        run: >-
          cmake -S tests/abi -B target/cpp-consumer
          -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/target/install"
          -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build target/cpp-consumer --config Release --parallel
      - run: ctest --test-dir target/cpp-consumer --build-config Release --output-on-failure
      - name: Configure guide examples without Cargo
        shell: bash
        run: >-
          cmake -S docs/examples -B target/doc-examples
          -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/target/install"
          -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build target/doc-examples --config Release --parallel
      - run: ctest --test-dir target/doc-examples --build-config Release --output-on-failure
      - name: Verify native package
        shell: bash
        env:
          LINK_LIBRARY: ${{ matrix.link_library }}
          STATIC_LIBRARY: ${{ matrix.static_library }}
          RUNTIME_LIBRARY: ${{ matrix.runtime_library }}
          CLI_EXECUTABLE: ${{ matrix.cli_executable }}
        run: |
          test -f "target/install/lib/$LINK_LIBRARY"
          test -f "target/install/lib/$STATIC_LIBRARY"
          test -f target/install/include/postproject/postproject.h
          test -f target/install/include/postproject/postproject.hpp
          test -f "target/install/bin/$CLI_EXECUTABLE"
          if [[ -n "$RUNTIME_LIBRARY" ]]; then
            test -f "target/install/bin/$RUNTIME_LIBRARY"
          fi
      - name: Configure installed C quickstart
        shell: bash
        run: >-
          cmake -S target/install/share/doc/postproject/examples/c
          -B target/c-quickstart
          -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/target/install"
          -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build target/c-quickstart --config Release --parallel
      - run: >-
          ctest --test-dir target/c-quickstart --build-config Release
          --output-on-failure
      - name: Configure installed C++ quickstart
        shell: bash
        run: >-
          cmake -S target/install/share/doc/postproject/examples/cpp
          -B target/cpp-quickstart
          -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/target/install"
          -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build target/cpp-quickstart --config Release --parallel
      - run: >-
          ctest --test-dir target/cpp-quickstart --build-config Release
          --output-on-failure
      - name: Run installed Python quickstart
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/python/src
          POSTPROJECT_LIBRARY: ${{ github.workspace }}/target/release/${{ matrix.python_library }}
        run: >-
          python target/install/share/doc/postproject/examples/python/quickstart.py
          target/python-quickstart.pproj
          target/install/share/doc/postproject/examples/fixtures/sample-media.dat
      - name: Test the platform wheel without a library path
        if: matrix.wheel_platform != ''
        shell: bash
        env:
          PYTHON_LIBRARY: ${{ matrix.python_library }}
          WHEEL_PLATFORM: ${{ matrix.wheel_platform }}
        run: |
          python -m pip wheel --disable-pip-version-check --no-deps ./python --wheel-dir target/wheel
          python tools/build_platform_wheel.py target/wheel/*.whl \
            "target/release/$PYTHON_LIBRARY" "$WHEEL_PLATFORM" --output-dir target/platform-wheel
          python -m venv target/platform-wheel-venv
          venv_python=target/platform-wheel-venv/bin/python
          [[ -x "$venv_python" ]] || venv_python=target/platform-wheel-venv/Scripts/python.exe
          "$venv_python" -m pip install --disable-pip-version-check --no-deps target/platform-wheel/*.whl
          "$venv_python" examples/python/quickstart.py \
            target/platform-wheel-quickstart.pproj examples/fixtures/sample-media.dat
      - uses: actions/upload-artifact@v4
        with:
          name: postproject-${{ matrix.artifact }}
          path: target/install
          if-no-files-found: error

  python-wheel:
    name: Python wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p postproject-ffi
      - run: python -m pip wheel --no-deps ./python --wheel-dir target/wheel
      - name: Test installed wheel
        shell: bash
        run: |
          python -m venv target/wheel-venv
          target/wheel-venv/bin/python -m pip install --no-deps target/wheel/*.whl
          POSTPROJECT_LIBRARY="$GITHUB_WORKSPACE/target/release/libpostproject.so" \
            target/wheel-venv/bin/python examples/python/quickstart.py \
            target/wheel-quickstart.pproj examples/fixtures/sample-media.dat

  platform-wheel-linux:
    name: Linux platform wheel (glibc 2.28)
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked -p postproject-ffi
      - name: Require no glibc newer than 2.28
        run: tools/check_glibc.sh target/release/libpostproject.so 2.28
      - name: Build and test the platform wheel without a library path
        run: |
          python3.11 -m pip wheel --disable-pip-version-check --no-deps ./python --wheel-dir target/wheel
          python3.11 tools/build_platform_wheel.py target/wheel/*.whl \
            target/release/libpostproject.so manylinux_2_28_x86_64 --output-dir target/platform-wheel
          python3.11 -m venv target/platform-wheel-venv
          target/platform-wheel-venv/bin/python -m pip install --disable-pip-version-check \
            --no-deps target/platform-wheel/*.whl
          target/platform-wheel-venv/bin/python examples/python/quickstart.py \
            target/platform-wheel-quickstart.pproj examples/fixtures/sample-media.dat

  sanitizers:
    name: Native ASan and UBSan
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p postproject-ffi
      - name: Compile sanitized C consumer
        run: >-
          cc -std=c11 -Wall -Wextra -Werror
          -fsanitize=address,undefined -fno-omit-frame-pointer
          -Iinclude tests/abi/c_smoke.c
          -Ltarget/release -lpostproject
          -Wl,-rpath,$PWD/target/release
          -o target/c-smoke-sanitized
      - run: target/c-smoke-sanitized target/c-smoke-sanitized.pproj target
      - name: Install native package
        run: >-
          cmake -S . -B target/cmake-sanitized-package
          -DPOSTPROJECT_LIBRARY="$GITHUB_WORKSPACE/target/release/libpostproject.so"
          -DPOSTPROJECT_STATIC_LIBRARY="$GITHUB_WORKSPACE/target/release/libpostproject.a"
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/target/sanitized-install"
          -DCMAKE_BUILD_TYPE=Release
      - run: cmake --install target/cmake-sanitized-package
      - name: Configure sanitized C++ consumer
        run: >-
          cmake -S tests/abi -B target/cpp-sanitized
          -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/target/sanitized-install"
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS=-fsanitize=address,undefined
          -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined
      - run: cmake --build target/cpp-sanitized --parallel
      - run: ctest --test-dir target/cpp-sanitized --output-on-failure
