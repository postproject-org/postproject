name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  source:
    name: Source archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Verify tag version
        shell: bash
        run: |
          python3 tools/check_versions.py
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test -n "$version"
          test "$GITHUB_REF_NAME" = "v$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Build source archive and checksum
        shell: bash
        run: |
          mkdir dist
          archive="postproject-${{ steps.version.outputs.value }}-source.tar.gz"
          git archive \
            --format=tar.gz \
            --prefix="postproject-${{ steps.version.outputs.value }}/" \
            --output="dist/$archive" \
            HEAD
          cd dist
          cmake -E sha256sum "$archive" > "$archive.sha256"
      - name: Render the Flatpak module for the source archive
        shell: bash
        run: |
          version="${{ steps.version.outputs.value }}"
          python3 tools/flatpak_module.py render --version "$version" \
            --sha256 "$(cut -d ' ' -f 1 "dist/postproject-$version-source.tar.gz.sha256")" \
            --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-source
          path: dist
          if-no-files-found: error

  native:
    name: Native archive (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            link_library: libpostproject.so
            static_library: libpostproject.a
            runtime_library: ""
            cli_executable: postproject
            artifact: linux-x86_64
            format: tar.gz
          - os: macos-latest
            link_library: libpostproject.dylib
            static_library: libpostproject.a
            runtime_library: ""
            cli_executable: postproject
            artifact: macos-native
            format: tar.gz
          - os: windows-latest
            link_library: postproject.dll.lib
            static_library: postproject.lib
            runtime_library: postproject.dll
            cli_executable: postproject.exe
            artifact: windows-x86_64
            format: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p postproject-ffi
      - run: cargo build --release --locked -p postproject-cli
      - name: Install native package
        shell: bash
        env:
          LINK_LIBRARY: ${{ matrix.link_library }}
          STATIC_LIBRARY: ${{ matrix.static_library }}
          RUNTIME_LIBRARY: ${{ matrix.runtime_library }}
          CLI_EXECUTABLE: ${{ matrix.cli_executable }}
        run: |
          package_args=(
            -S .
            -B target/release-package
            "-DPOSTPROJECT_LIBRARY=$GITHUB_WORKSPACE/target/release/$LINK_LIBRARY"
            "-DPOSTPROJECT_STATIC_LIBRARY=$GITHUB_WORKSPACE/target/release/$STATIC_LIBRARY"
            "-DPOSTPROJECT_CLI_EXECUTABLE=$GITHUB_WORKSPACE/target/release/$CLI_EXECUTABLE"
            "-DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/target/install"
            -DCMAKE_BUILD_TYPE=Release
          )
          if [[ -n "$RUNTIME_LIBRARY" ]]; then
            package_args+=("-DPOSTPROJECT_RUNTIME_LIBRARY=$GITHUB_WORKSPACE/target/release/$RUNTIME_LIBRARY")
          fi
          cmake "${package_args[@]}"
          cmake --install target/release-package
      - name: Build archive and checksum
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
          FORMAT: ${{ matrix.format }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="postproject-$version-$ARTIFACT.$FORMAT"
          mkdir dist
          cd target/install
          if [[ "$FORMAT" = zip ]]; then
            cmake -E tar cf "$GITHUB_WORKSPACE/dist/$archive" --format=zip .
          else
            cmake -E tar cfvz "$GITHUB_WORKSPACE/dist/$archive" .
          fi
          cd "$GITHUB_WORKSPACE/dist"
          cmake -E sha256sum "$archive" > "$archive.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: release-native-${{ matrix.artifact }}
          path: dist
          if-no-files-found: error

  wheel:
    name: Python wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p postproject-ffi
      - name: Build wheel and checksum
        shell: bash
        run: |
          python -m pip wheel --no-deps ./python --wheel-dir dist
          cd dist
          wheels=(*.whl)
          test "${#wheels[@]}" -eq 1
          cmake -E sha256sum "${wheels[0]}" > "${wheels[0]}.sha256"
      - name: Test installed wheel
        shell: bash
        run: |
          python -m venv target/wheel-venv
          target/wheel-venv/bin/python -m pip install --no-deps dist/*.whl
          POSTPROJECT_LIBRARY="$GITHUB_WORKSPACE/target/release/libpostproject.so" \
            target/wheel-venv/bin/python examples/python/quickstart.py \
            target/wheel-quickstart.pproj examples/fixtures/sample-media.dat
      - uses: actions/upload-artifact@v4
        with:
          name: release-python-wheel
          path: dist
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [source, native, wheel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Publish tagged artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --prerelease
          --title "PostProject $GITHUB_REF_NAME"
          --generate-notes
