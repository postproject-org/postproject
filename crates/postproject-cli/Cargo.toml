[package]
name = "postproject-cli"
description = "Command-line demonstrator for PostProject"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "postproject"
path = "src/main.rs"
doc = false

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
postproject-core = { version = "0.5.0-alpha.1", path = "../postproject-core" }
postproject-media = { version = "0.5.0-alpha.1", path = "../postproject-media" }
postproject-storage-sqlite = { version = "0.5.0-alpha.1", path = "../postproject-storage-sqlite" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"

[lints]
workspace = true
