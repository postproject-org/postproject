[package]
name = "postproject-storage-sqlite"
description = "SQLite persistence backend for PostProject"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[dependencies]
blake3 = "1"
postproject-core = { version = "0.7.0-alpha.1", path = "../postproject-core" }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "limits"] }

[dev-dependencies]
blake3 = "1"
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
postproject-media = { version = "0.7.0-alpha.1", path = "../postproject-media" }
tempfile = "3"

[[bench]]
name = "release_0_1"
harness = false

[[bench]]
name = "large_fixture"
harness = false

[[bench]]
name = "release_0_4_baseline"
harness = false

[[bench]]
name = "release_0_4_queries"
harness = false

[lints]
workspace = true
